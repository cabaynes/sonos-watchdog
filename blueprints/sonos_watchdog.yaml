blueprint:
  name: Sonos Watchdog
  description: >
    Brings a Sonos speaker back into the group you were playing when it drops off the
    network and comes back. It never undoes a change you made yourself: a speaker that
    leaves the group while still online (you ungrouped it, or switched to a smaller
    group or preset) is left alone.


    It cannot see or fix the other kind of Sonos dropout, where a speaker stays in the
    group but goes silent. See FINDINGS.md in the repository for why.


    Needs one text helper (max length 255) to remember which speakers belong to the
    session.
  domain: automation
  source_url: https://github.com/cabaynes/sonos-watchdog/blob/main/blueprints/sonos_watchdog.yaml
  input:
    speakers:
      name: Sonos speakers
      description: Every Sonos speaker to watch.
      selector:
        entity:
          domain: media_player
          multiple: true
    intended_helper:
      name: Session helper
      description: >
        A text helper (input_text, max length 255) where the watchdog stores which speakers
        belong to the current session. Create it under Settings → Devices & services → Helpers.
      default: input_text.sonos_intended_speakers
      selector:
        entity:
          domain: input_text
    settle_seconds:
      name: Settle time (seconds)
      description: >
        How long a smaller group must stay smaller before the watchdog decides why a speaker
        left: offline (it will be brought back) or still online (your change, left alone).
      default: 60
      selector:
        number: {min: 10, max: 600, unit_of_measurement: seconds}
    recovery_seconds:
      name: Wait after a speaker comes back (seconds)
      description: Sonos speakers answer the network slightly before they accept commands.
      default: 3
      selector:
        number: {min: 1, max: 30, unit_of_measurement: seconds}
    forget_minutes:
      name: Forget the session after (minutes)
      description: After this long with nothing playing, the session is over and forgotten.
      default: 15
      selector:
        number: {min: 1, max: 240, unit_of_measurement: minutes}
    wired_speakers:
      name: Wired speakers (optional)
      description: >
        Speakers connected by Ethernet. Each session's log line says whether one of them
        leads, and with a handover command (below) a wired speaker takes the lead whenever
        its group has been paused for a while.
      default: []
      selector:
        entity:
          domain: media_player
          multiple: true
    handover_command:
      name: Handover command (optional)
      description: >
        The rest_command that asks a Sonos speaker to hand its group to another speaker, e.g.
        rest_command.sonos_delegate. Set it up first — see docs/wired-leader.md. Leave empty
        to only log who leads.
      default: ""
      selector:
        text:
    handover_after_pause:
      name: Hand over after a pause of (seconds)
      description: >
        The lead only ever moves while the group is paused (moving it mid-song puts the
        group out of sync). This is how long the pause must last first.
      default: 30
      selector:
        number: {min: 10, max: 600, unit_of_measurement: seconds}
    log_notify:
      name: Log file (optional)
      description: >
        A notify entity from the File integration. Every event is appended as one line
        (time,event,subject,detail), so the history outlives the logbook's ~10 days.
      default: ""
      selector:
        entity:
          domain: notify
    counter_sessions:
      name: Sessions counter (optional)
      default: ""
      selector:
        entity: {domain: counter}
    counter_left:
      name: Speakers-left counter (optional)
      default: ""
      selector:
        entity: {domain: counter}
    counter_offline:
      name: Speakers-offline counter (optional)
      default: ""
      selector:
        entity: {domain: counter}
    counter_repairs:
      name: Repairs counter (optional)
      default: ""
      selector:
        entity: {domain: counter}

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: state
    id: grew_or_started
    entity_id: !input speakers
    attribute: group_members
  - trigger: state
    id: grew_or_started
    entity_id: !input speakers
    to: playing
  - trigger: state
    id: settled
    entity_id: !input speakers
    attribute: group_members
    for:
      seconds: !input settle_seconds
  - trigger: state
    id: back_online
    entity_id: !input speakers
    from: unavailable
    to: [idle, paused]
    for:
      seconds: !input recovery_seconds
  - trigger: state
    id: went_offline
    entity_id: !input speakers
    to: unavailable
  - trigger: state
    id: paused_long
    entity_id: !input speakers
    to: paused
    for:
      seconds: !input handover_after_pause
  - trigger: time_pattern
    id: sweep
    seconds: /10
  - trigger: state
    id: went_quiet
    entity_id: !input speakers
    from: playing
    for:
      minutes: !input forget_minutes

variables:
  speakers: !input speakers
  helper: !input intended_helper
  wired_speakers: !input wired_speakers
  handover_command: !input handover_command
  log_notify: !input log_notify
  counter_sessions: !input counter_sessions
  counter_left: !input counter_left
  counter_offline: !input counter_offline
  counter_repairs: !input counter_repairs
  tid: "{{ trigger.id if trigger.id is defined else '' }}"
  now_ts: "{{ as_timestamp(now()) | int }}"
  raw: "{{ states(helper) if states(helper) not in ['unknown', 'unavailable'] else '' }}"
  stored: >-
    {%- if '|' in raw -%}
      {%- set parts = raw.split('|', 1) -%}
      {%- set start = parts[0] | int(none) -%}
      {%- set m = parts[1] -%}
    {%- else -%}
      {%- set start = none -%}
      {%- set m = raw -%}
    {%- endif -%}
    {{ {'start': start, 'members': m.split(',') | map('trim') | reject('eq', '') | list} }}
  session_master: >-
    {%- set ns = namespace(m=none) -%}
    {%- for s in speakers -%}
      {%- set g = state_attr(s, 'group_members') or [] -%}
      {%- if ns.m is none and is_state(s, 'playing') and g and g[0] == s -%}
        {%- if stored.members and (g | select('in', stored.members) | list | length) > 0 -%}
          {%- set ns.m = s -%}
        {%- elif not stored.members and (g | length) > 1 -%}
          {%- set ns.m = s -%}
        {%- endif -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.m }}
  master_group: "{{ (state_attr(session_master, 'group_members') or []) if session_master else [] }}"
  missing: >-
    {%- set ns = namespace(m=[]) -%}
    {%- if session_master -%}
      {%- for s in stored.members -%}
        {%- set g = state_attr(s, 'group_members') or [] -%}
        {%- if s not in master_group and states(s) in ['idle', 'paused'] and (g | length) < 2 -%}
          {%- set ns.m = ns.m + [s] -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endif -%}
    {{ ns.m }}
  trig: "{{ trigger.entity_id if trigger.entity_id is defined and trigger.entity_id else '' }}"
  trig_group: "{{ (state_attr(trig, 'group_members') or []) if trig else [] }}"
  trigger_is_coordinator: "{{ trig != '' and is_state(trig, 'playing') and (trig_group | length) > 0 and trig_group[0] == trig }}"
  same_session: "{{ (trig_group | select('in', stored.members) | list | length) > 0 }}"
  new_members: >-
    {%- if trigger_is_coordinator -%}
      {%- set ns = namespace(m=trig_group | list) -%}
      {%- if same_session -%}
        {%- for s in stored.members -%}
          {%- if s not in ns.m and is_state(s, 'unavailable') -%}
            {%- set ns.m = ns.m + [s] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {{ ns.m }}
    {%- else -%}
      {{ stored.members }}
    {%- endif -%}
  prev_group: >-
    {%- if trigger.from_state is defined and trigger.from_state and trigger.from_state.attributes is defined -%}
      {{ trigger.from_state.attributes.group_members or [] }}
    {%- else -%}
      {{ [] }}
    {%- endif -%}
  departed_online: >-
    {%- set ns = namespace(m=[]) -%}
    {%- if tid == 'settled' and trigger_is_coordinator and same_session -%}
      {%- for s in prev_group -%}
        {%- if s not in trig_group and s in stored.members and not is_state(s, 'unavailable') -%}
          {%- set ns.m = ns.m + [s] -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endif -%}
    {{ ns.m }}
  departed_offline: >-
    {%- set ns = namespace(m=[]) -%}
    {%- if tid == 'settled' and trigger_is_coordinator and same_session -%}
      {%- for s in prev_group -%}
        {%- if s not in trig_group and s in stored.members and is_state(s, 'unavailable') -%}
          {%- set ns.m = ns.m + [s] -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endif -%}
    {{ ns.m }}
  grew: "{{ (new_members | reject('in', stored.members) | list | length) > 0 }}"
  new_session: "{{ trigger_is_coordinator and ((not stored.members) or (not same_session)) }}"
  record: >-
    {%- if not trigger_is_coordinator -%}
      {{ false }}
    {%- elif tid == 'grew_or_started' -%}
      {{ new_session or grew }}
    {%- elif tid == 'settled' -%}
      {{ (new_members | sort) != (stored.members | sort) }}
    {%- else -%}
      {{ false }}
    {%- endif -%}
  session_playing: "{{ (stored.members | select('is_state', 'playing') | list | length) > 0 }}"
  do_repair: "{{ tid in ['back_online', 'sweep'] and session_master is not none and (missing | length) > 0 }}"
  do_forget: "{{ tid == 'went_quiet' and (stored.members | length) > 0 and not session_playing }}"
  paused_leader: >-
    {{ trig if (tid == 'paused_long' and trig and is_state(trig, 'paused')
                and (trig_group | length) > 0 and trig_group[0] == trig) else '' }}
  leader: "{{ trig if (trigger_is_coordinator or paused_leader) else (session_master or '') }}"
  source: >-
    {%- set c = ((state_attr(leader, 'media_content_id') or '') if leader else '') | string -%}
    {%- if c.startswith('x-sonos-spotify:') -%}Spotify
    {%- elif 'sid=204' in c -%}Apple Music
    {%- elif c.startswith('x-sonos-vli:') and 'airplay' in c -%}AirPlay
    {%- elif c.startswith('x-sonos-htastream:') -%}TV
    {%- elif c.startswith('x-rincon-mp3radio:') or c.startswith('x-sonos-http:sonos') or c.startswith('x-sonosapi-') -%}Radio
    {%- elif c.startswith('x-rincon-stream:') -%}Line-in
    {%- else -%}Other
    {%- endif -%}
  wired: "{{ 'n/a' if not wired_speakers else ('yes' if leader in wired_speakers else 'no') }}"
  handover_target: >-
    {%- set ns = namespace(t=none) -%}
    {%- if paused_leader and wired_speakers and paused_leader not in wired_speakers
          and source not in ['TV', 'Line-in'] -%}
      {%- for s in trig_group -%}
        {%- if ns.t is none and s in wired_speakers and not is_state(s, 'unavailable') -%}
          {%- set ns.t = s -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endif -%}
    {{ ns.t }}
  handover_ip: >-
    {%- set url = (device_attr(device_id(paused_leader), 'configuration_url') or '') if paused_leader else '' -%}
    {{ url.split('//')[1].split(':')[0].split('/')[0] if '//' in url else '' }}
  handover_uid: >-
    {%- set ns = namespace(u='') -%}
    {%- if handover_target -%}
      {%- for i in (device_attr(device_id(handover_target), 'identifiers') or []) -%}
        {%- if i[0] == 'sonos' -%}{%- set ns.u = i[1] -%}{%- endif -%}
      {%- endfor -%}
    {%- endif -%}
    {{ ns.u }}
  do_handover: >-
    {{ handover_target is not none and handover_command not in [none, '']
       and handover_ip != '' and handover_uid != '' }}
  helper_value: >-
    {%- set start = stored.start if (same_session and stored.start) else now_ts -%}
    {%- set ns = namespace(v=(start | string) ~ '|', first=true, full=false) -%}
    {%- for s in new_members -%}
      {%- set add = s if ns.first else ',' ~ s -%}
      {%- if not ns.full and ((ns.v ~ add) | length) <= 255 -%}
        {%- set ns.v = ns.v ~ add -%}
        {%- set ns.first = false -%}
      {%- else -%}
        {%- set ns.full = true -%}
      {%- endif -%}
    {%- endfor -%}
    {{ ns.v }}
  helper_full: "{{ (helper_value.split('|', 1)[1].split(',') | length) < (new_members | length) }}"
  away_s: >-
    {%- if tid == 'back_online' and trigger.from_state is defined and trigger.from_state -%}
      {{ (now_ts - as_timestamp(trigger.from_state.last_changed, now_ts)) | int }}
    {%- else -%}
      {{ 0 }}
    {%- endif -%}
  log_events: >-
    {%- set ns = namespace(e=[], why=[]) -%}
    {%- set full = '; helper full' if helper_full else '' -%}
    {%- set members_txt = new_members | join(';') -%}
    {%- set ended = 'duration_s=' ~ (now_ts - stored.start) if stored.start else 'duration=unknown' -%}
    {%- if record and new_session -%}
      {%- if stored.members -%}
        {%- set ns.e = ns.e + [{'event': 'session_end', 'subject': stored.members[0], 'detail': ended}] -%}
      {%- endif -%}
      {%- set ns.e = ns.e + [{'event': 'session_start', 'subject': leader,
          'detail': 'leader=' ~ leader ~ '; members=' ~ members_txt ~ '; source=' ~ source ~ '; wired=' ~ wired ~ full}] -%}
    {%- elif record or departed_online or departed_offline -%}
      {%- for s in departed_online -%}
        {%- set ns.e = ns.e + [{'event': 'speaker_left', 'subject': s, 'detail': 'online; leader=' ~ leader}] -%}
      {%- endfor -%}
      {%- for s in departed_offline -%}
        {%- set ns.e = ns.e + [{'event': 'speaker_left', 'subject': s, 'detail': 'offline; leader=' ~ leader}] -%}
      {%- endfor -%}
      {%- if grew -%}{%- set ns.why = ns.why + ['grew'] -%}{%- endif -%}
      {%- if departed_offline -%}{%- set ns.why = ns.why + ['went offline'] -%}{%- endif -%}
      {%- if departed_online -%}{%- set ns.why = ns.why + ['left on purpose'] -%}{%- endif -%}
      {%- set ns.e = ns.e + [{'event': 'session_change', 'subject': leader,
          'detail': 'before=' ~ (stored.members | join(';')) ~ '; after=' ~ members_txt ~ '; why=' ~ (ns.why | join(' + ')) ~ full}] -%}
    {%- endif -%}
    {%- if tid == 'went_offline' and trig -%}
      {%- set ns.e = ns.e + [{'event': 'speaker_offline', 'subject': trig,
          'detail': 'in_session=' ~ ('yes' if trig in stored.members else 'no')}] -%}
    {%- endif -%}
    {%- if tid == 'back_online' and trig -%}
      {%- set ns.e = ns.e + [{'event': 'speaker_online', 'subject': trig, 'detail': 'offline_s=' ~ away_s}] -%}
      {%- if session_master and trig in master_group -%}
        {%- set ns.e = ns.e + [{'event': 'speaker_back', 'subject': trig, 'detail': 'by=sonos; away_s=' ~ away_s}] -%}
      {%- elif do_repair and trig in missing -%}
        {%- set ns.e = ns.e + [{'event': 'repair', 'subject': missing | join(';'),
            'detail': 'path=back_online; leader=' ~ session_master}] -%}
        {%- set ns.e = ns.e + [{'event': 'speaker_back', 'subject': trig, 'detail': 'by=watchdog; away_s=' ~ away_s}] -%}
      {%- endif -%}
    {%- endif -%}
    {%- if tid == 'sweep' and do_repair -%}
      {%- set ns.e = ns.e + [{'event': 'repair', 'subject': missing | join(';'), 'detail': 'path=sweep; leader=' ~ session_master}] -%}
    {%- endif -%}
    {%- if do_forget -%}
      {%- set ns.e = ns.e + [{'event': 'session_end', 'subject': stored.members[0], 'detail': ended}] -%}
    {%- endif -%}
    {%- if do_handover -%}
      {%- set ns.e = ns.e + [{'event': 'leader_moved', 'subject': handover_target,
          'detail': 'from=' ~ paused_leader ~ '; to=' ~ handover_target}] -%}
    {%- endif -%}
    {{ ns.e }}
  act: "{{ record or do_repair or do_forget or do_handover or (log_events | length) > 0 }}"

conditions:
  - condition: template
    value_template: "{{ act }}"

actions:
  - choose:
      - conditions: "{{ record }}"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: "{{ helper }}"
            data:
              value: "{{ helper_value }}"
      - conditions: "{{ do_repair }}"
        sequence:
          - action: media_player.join
            target:
              entity_id: "{{ session_master }}"
            data:
              group_members: "{{ missing }}"
      - conditions: "{{ do_forget }}"
        sequence:
          - action: input_text.set_value
            target:
              entity_id: "{{ helper }}"
            data:
              value: ""
      - conditions: "{{ do_handover }}"
        sequence:
          - action: "{{ handover_command }}"
            data:
              ip: "{{ handover_ip }}"
              uid: "{{ handover_uid }}"
  - repeat:
      for_each: "{{ log_events }}"
      sequence:
        - action: logbook.log
          data:
            name: Sonos Watchdog
            message: "{{ repeat.item.event }}: {{ repeat.item.subject }} ({{ repeat.item.detail }})"
        - if: "{{ log_notify not in [none, ''] }}"
          then:
            - action: notify.send_message
              target:
                entity_id: "{{ log_notify }}"
              data:
                message: "{{ now().isoformat() }},{{ repeat.item.event }},{{ repeat.item.subject }},{{ repeat.item.detail }}"
        - variables:
            counter_for_event: >-
              {{ {'session_start': counter_sessions, 'speaker_left': counter_left,
                  'speaker_offline': counter_offline, 'repair': counter_repairs}.get(repeat.item.event, '') }}
        - if: "{{ counter_for_event not in [none, ''] }}"
          then:
            - action: counter.increment
              target:
                entity_id: "{{ counter_for_event }}"
